name: Build Celeste port (armhf / A23)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Port version"
        default: "0.0.1"
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: write

concurrency:
  group: celeste-${{ github.ref }}
  cancel-in-progress: true

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build cross toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fr36s-celeste
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build native stack + package
        run: |
          V="${{ github.event.inputs.version || '0.0.1' }}"
          docker run --rm -v "$PWD:/work" -w /work fr36s-celeste \
            bash -c "./build.sh $V"

      - name: Take ownership of the build output
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" out work 2>/dev/null || true

      - name: Verify everything is 32-bit ARM
        run: |
          set -e
          unzip -q -o out/celeste-port-*.zip -d "$RUNNER_TEMP/verify"
          cd "$RUNNER_TEMP"
          fail=0
          # Every file in the port, not just libs/ and mono/bin: the runtime .so
          # files under mono/lib are just as fatal if one comes out amd64.
          for so in $(find verify/ports -type f 2>/dev/null); do
            if file "$so" | grep -q ELF; then
              if file "$so" | grep -q "ELF 32-bit.*ARM"; then
                echo "ok   $(basename "$so")"
              else
                echo "FAIL $(basename "$so"): $(file -b "$so")"; fail=1
              fi
            fi
          done
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: celeste-port
          path: out/*

      - name: Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ github.event.inputs.version || '0.0.1' }}"
          # Explicit file list, never a glob over out/: a stray directory in there
          # makes the upload fail and leaves a half-created release behind.
          FILES=$(ls out/celeste-port-*.zip out/celeste-port-*.zip.sha256)
          gh release view "v$V" >/dev/null 2>&1 \
            && gh release upload "v$V" $FILES --clobber \
            || gh release create "v$V" $FILES --title "Celeste port v$V" --notes-file RELEASE.md
